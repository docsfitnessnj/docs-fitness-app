name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The project ref itself isn't secret (it's already visible in the
      # app's own Supabase URL) — only the access token above is.
      SUPABASE_PROJECT_REF: qooezwnskaqvmquydijg
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is not set — Edge Functions were NOT deployed. See supabase/functions/README.md."
            exit 1
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
