name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The project ref itself isn't secret (it's already visible in the
      # app's own Supabase URL) — only the access token above is.
      SUPABASE_PROJECT_REF: qooezwnskaqvmquydijg
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is not set — Edge Functions were NOT deployed. See supabase/functions/README.md."
            exit 1
          fi
          # --yes: newer Supabase CLI versions require explicit confirmation
          # in non-interactive runs (without it the deploy exits 1 having
          # changed nothing — "This run can't ask because stdout is not a
          # terminal"), which is exactly what broke the Round 56 deploy.
          supabase functions deploy --yes --project-ref "$SUPABASE_PROJECT_REF"
