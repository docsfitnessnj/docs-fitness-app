# Supabase project configuration for the CLI (deploys, local dev).
# See supabase/functions/README.md for the full deploy/secrets checklist.
project_id = "qooezwnskaqvmquydijg"

# create-checkout and customer-portal require a signed-in member — Supabase
# checks the caller's JWT before the function code even runs (the default).
[functions.create-checkout]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true

# The Stripe webhook is called by Stripe itself, never by a signed-in member
# — it has no Supabase JWT to check. It verifies who it's really talking to
# a different way instead: the Stripe-Signature header, checked against
# STRIPE_WEBHOOK_SECRET inside the function itself.
[functions.stripe-webhook]
verify_jwt = false
