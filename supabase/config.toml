# Supabase project configuration for the CLI (deploys, local dev).
# See supabase/functions/README.md for the full deploy/secrets checklist.
project_id = "qooezwnskaqvmquydijg"

# create-checkout and customer-portal require a signed-in member — Supabase
# checks the caller's JWT before the function code even runs (the default).
[functions.create-checkout]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true

# The Stripe webhook is called by Stripe itself, never by a signed-in member
# — it has no Supabase JWT to check. It verifies who it's really talking to
# a different way instead: the Stripe-Signature header, checked against
# STRIPE_WEBHOOK_SECRET inside the function itself.
[functions.stripe-webhook]
verify_jwt = false

# Round 56: both of these are called by migration_033.sql's own Postgres
# triggers/cron functions over pg_net, never by a signed-in member — no
# Supabase JWT exists for either call. Each verifies the caller a
# different way instead: a shared secret header (DB_WEBHOOK_SECRET), set
# once in both Supabase Vault (for the SQL side) and here as an Edge
# Function secret (for this side) — see migration_033.sql's own top
# comment and supabase/functions/_shared/webhookAuth.ts.
[functions.notify-new-signup]
verify_jwt = false

[functions.send-weekly-release-email]
verify_jwt = false

# A real signed-in admin triggers this one directly from the app (the
# EMAIL admin screen's SEND TEST EMAIL button) — a real Supabase JWT exists
# here, checked before anything else, plus an explicit is_admin check
# inside the function itself.
[functions.admin-send-test-email]
verify_jwt = true

# Round 64: the EMAIL admin screen's SEND TEST WELCOME EMAILS button —
# same admin-only gate as admin-send-test-email above.
[functions.admin-send-test-welcome-emails]
verify_jwt = true
