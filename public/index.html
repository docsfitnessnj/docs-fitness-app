<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Kettlebell workouts. Class booking. Weekly challenge. All in one app."
    />

    <!-- Brand mark for the browser tab and any "add to home screen" save —
         keep these two filenames (favicon.png / apple-touch-icon.png) and
         the og:image / twitter:image filenames below in sync with the
         files this template ships alongside (see public/) and with
         APP_SHARE_URL in src/lib/links.ts if that ever moves. -->
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <!-- Open Graph — the rich preview card shown by Messages, WhatsApp,
         Instagram DMs, Slack, and most email clients when this link is
         shared. og:image/og:url must be fully-qualified absolute URLs per
         spec; relative paths aren't reliably resolved by every crawler.

         A SINGLE og:image, pointing at the square 1200x1200 version, on
         purpose. Two rounds of trying multiple og:image tags (wide first,
         then square first) both still showed iMessage tiling/cropping the
         image — reordering never changed the symptom, which means
         iMessage isn't reliably respecting "first tag wins" the way its
         behavior seemed to suggest, and there's no reliable way from here
         to make a specific consumer choose the "right" one out of several.
         A single square image removes that ambiguity entirely: every
         consumer gets the same file, and a square image degrades
         acceptably everywhere (including on wide-preferring cards), while
         a wide image forced into iMessage's square-ish preview does not.
         Twitter/X still gets its own dedicated wide image below via
         twitter:image, a separate tag this doesn't touch.

         The "-v3" suffix on both filenames below is a deliberate cache bust
         (v2 -> v3): the v2 file's pixels were re-verified correct (crew
         photo composition, no CTA) both locally and by fetching the exact
         file GitHub was serving at the deployed commit, so this wasn't a
         bad regeneration — but a platform preview was still showing a
         stale image, and per the same Instagram-caching precedent that
         motivated v1 -> v2, the only reliable fix for a cache like that is
         a brand new URL. If this image is ever regenerated again, bump
         the suffix again (v4, v5, ...) rather than overwriting the same
         filename in place. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docsfitnessnj.github.io/docs-fitness-app" />
    <meta property="og:title" content="Join Doc's Fitness: Train Online or In Person" />
    <meta
      property="og:description"
      content="Kettlebell workouts. Class booking. Weekly challenge. All in one app."
    />
    <meta property="og:image" content="https://docsfitnessnj.github.io/docs-fitness-app/share-image-square-v3.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Doc's Fitness — kettlebell training, in person and online." />

    <!-- Twitter/X Card — mirrors the Open Graph tags above. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join Doc's Fitness: Train Online or In Person" />
    <meta
      name="twitter:description"
      content="Kettlebell workouts. Class booking. Weekly challenge. All in one app."
    />
    <meta name="twitter:image" content="https://docsfitnessnj.github.io/docs-fitness-app/share-image-v3.jpg" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element

         Extended past the stock reset to fix the app's full-screen height
         on iOS, in two rounds:

         Round 1 (plain `height: 100%`): on iOS Safari, `100%` resolves
         against a snapshot of the viewport taken when the page loads and
         doesn't reliably re-run when Safari's chrome shows or hides, so
         the page could end up TALLER than the actual visible content —
         extra space below the real content that read as a white gap and
         made the page scrollable past its content.

         Round 2 (`height: 100dvh`): fixed the above by tracking the
         *current* browser-chrome state instead of a load-time snapshot,
         but this app also turns off page-level scrolling (`body {
         overflow: hidden }`, below) since only inner ScrollViews are
         meant to scroll — so the outer document never receives the
         scroll gesture that normally makes a toolbar (especially the
         heavier top+bottom chrome some in-app browsers like Messages'
         and Instagram's add) collapse. On a browser where `dvh` then
         stays pinned to that chrome-heavy "small viewport" permanently,
         `html`/`body`/`#root` end up genuinely, permanently shorter than
         the physical screen — not a clipped child, an actually-short
         `<html>` element — so the remaining space renders as the bare
         browser canvas below it: unstyled, un-scrollable, and outside
         the app's DOM entirely.

         Round 3 (JS-measured `--app-height`): stopped depending on any
         single CSS viewport unit's specific browser behavior. The inline
         script measures the real height the browser reports via
         `visualViewport.height` / `window.innerHeight` and writes it to
         the `--app-height` custom property on every resize, orientation
         change, and visualViewport change — this is confirmed correct by
         a full ancestor-chain measurement (html through every nested
         container down to the ScrollView) that found every element's
         bottom edge lands exactly on the viewport edge, with no
         unaccounted-for shortfall.

         Round 4 (this one — initial-measurement timing): the app was
         still reported short on a real iPhone after round 3, which a
         resize/orientationchange/visualViewport-resize listener alone
         can't explain if nothing on the device ever resizes. The
         remaining plausible gap is *before* any of those events fire:
         on some in-app browsers `visualViewport.height` (or the chrome
         reservation behind `window.innerHeight`) may not be settled yet
         at the moment this synchronous inline script first runs — before
         fonts/images have loaded and before the browser's own chrome has
         finished laying itself out — so the very first `--app-height`
         value can be a smaller, transient reading that then never
         corrects itself, because no resize ever happens on that device
         to re-trigger the listeners. Re-running the same measurement a
         few more times right after load (`load`, `pageshow` — the event
         that fires on Safari's back/forward-cache restores, which a
         plain `load` listener misses — and a short burst of
         `requestAnimationFrame` re-checks over the first ~1.5s) means
         the value keeps self-correcting for a couple of seconds even
         with zero user interaction, without depending on anything ever
         resizing at all.

         Round 5 (--app-offset-top, for the on-screen keyboard): getting
         the height right (rounds 1-4) isn't enough once a screen has a
         focused text input. Opening the keyboard shrinks
         visualViewport.height as expected (--app-height tracks that
         correctly), but iOS Safari separately auto-scrolls — pans the
         *visual* viewport down within the *layout* viewport — to keep the
         focused input clear of the keyboard, changing
         visualViewport.offsetTop. WebKit deliberately positions
         `position: fixed` elements against the layout viewport, not the
         visual one (that's the whole reason the VisualViewport API
         exists), so a fixed, correctly-*sized* #root still sits at the
         layout viewport's untouched origin while the pan moves the
         visible slice somewhere else entirely — the app scrolls up out of
         view and what's left on screen is blank browser canvas above the
         keyboard. --app-offset-top mirrors visualViewport.offsetTop, and
         the signed-in layout (see useWebDocumentScroll.ts's `locked`
         branch, which also switches #root to `position: fixed` so it
         isn't clipped by html/body's fixed-height overflow:hidden box)
         translates #root by that amount, sliding it back under the
         panned visual viewport instead of leaving it behind. -->
    <script>
      (function () {
        // Browsers restore a scrollable element's previous scroll offset
        // after a reload/back-forward navigation by default (history.scrollRestoration
        // === 'auto') — normally invisible on a page that scrolls the
        // document itself, but this app's signed-in screens scroll an
        // inner <ScrollView> div instead, and since MembershipContext now
        // restores signedUp from localStorage, a reload can render that
        // same scrollable div again quickly enough for the browser to
        // match it up and reapply whatever offset it was at before — the
        // Community tab opening already scrolled past its own header.
        // 'manual' turns that off entirely; App.tsx's own
        // useFocusEffect-driven reset (see ScreenContainer) is what
        // establishes top-of-screen on mount/tab-focus instead.
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }

        function syncViewport() {
          var vv = window.visualViewport;
          var h = (vv && vv.height) || window.innerHeight;
          document.documentElement.style.setProperty('--app-height', h + 'px');
          document.documentElement.style.setProperty('--app-offset-top', (vv ? vv.offsetTop : 0) + 'px');
        }
        syncViewport();
        window.addEventListener('resize', syncViewport);
        window.addEventListener('orientationchange', syncViewport);
        window.addEventListener('load', syncViewport);
        window.addEventListener('pageshow', syncViewport);
        if (window.visualViewport) {
          // 'resize' catches height changes (keyboard open/close, chrome
          // collapse); 'scroll' catches offsetTop changing on its own,
          // which happens when iOS pans to reveal a focused input without
          // the visible height necessarily changing at the same instant.
          window.visualViewport.addEventListener('resize', syncViewport);
          window.visualViewport.addEventListener('scroll', syncViewport);
        }
        // Keep re-measuring for a bit after any trigger in case the
        // browser's own chrome (or visualViewport's reading of it) hasn't
        // settled yet when the first check runs — see "Round 4" above.
        // Exposed as window.__docsFitnessResettleViewport so React code
        // can re-arm this same burst at a *later* trigger than page load:
        // useWebDocumentScroll calls it the moment the signed-in, fixed
        // tab-bar layout (#root: position: fixed) engages, since
        // MembershipContext's localStorage restore can now land a person
        // straight into that layout within the first render — a point in
        // time the original page-load-timed burst below was never
        // designed to cover, and the same class of stale-measurement gap
        // that produced the dead-space-below-the-tab-bar bug this
        // approach already fixed once (see the height-reset comment
        // block above the #root rule further down).
        function settleFor(ms) {
          var settleStart = Date.now();
          function tick() {
            syncViewport();
            if (Date.now() - settleStart < ms) {
              requestAnimationFrame(tick);
            }
          }
          requestAnimationFrame(tick);
        }
        window.__docsFitnessResettleViewport = function () {
          settleFor(1200);
        };
        settleFor(1500);
      })();
    </script>
    <style id="expo-reset">
      /* Stops a downward drag inside any scroll container from chaining
         past its own edge to the browser, which is what triggers a native
         pull-to-refresh (a full page reload — on the signed-in app, that
         reload used to land back on the pre-signup Welcome screen, having
         nothing but in-memory state to restore from; see
         MembershipContext's localStorage persistence for the other half of
         that fix). overscroll-behavior only affects an element that is
         itself scrollable, so applying it to every element here is a
         no-op everywhere except the actual scroll containers (every
         screen's <ScrollView>) — no need to hunt down and annotate each
         one individually, and any ScrollView added later is covered too.
         `contain` (not `none`) so a screen can still show its own
         legitimate bounce/rubber-band at its own edges — it just never
         hands that gesture up to the browser chrome. */
      * {
        overscroll-behavior-y: contain;
      }
      /* These styles make the body full-height, tracking Safari's
         collapsing/expanding toolbar instead of a one-time snapshot. */
      html,
      body {
        height: 100%;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        background-color: #FBFBF9;
        overscroll-behavior-y: none;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        flex: 1;
        background-color: #FBFBF9;
        /* Harmless (0px) unless useWebDocumentScroll.ts's `locked` branch
           has also switched #root to position: fixed — see the Round 5
           comment above the inline script for why. */
        transform: translateY(var(--app-offset-top, 0px));
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
