<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale=1, user-scalable=no: locks pinch/double-tap zoom out
         entirely, matching Skool/native-app behavior. iOS Safari respects
         this most reliably in home-screen standalone mode (our actual
         target) even though some accessibility settings can override it in
         ordinary browser Safari -- see the gesturestart/change/end
         handlers and touch-action CSS below for the belt-and-suspenders
         fallback, and AGENTS.md's "Viewport lock" writeup.

         Round 13 deliberately does NOT declare interactive-widget=
         resizes-content (added in Round 12, removed here). On an iOS
         version that honors it, the OS's own viewport resize AND the JS
         --keyboard-inset rise below would both fire for the same keyboard
         open/close and fight each other -- exactly the "screen shrinking
         repeatedly while typing" a real device reported. One mechanism
         only: --keyboard-inset (see the inline script's "Round 12"/
         "Round 13" comments), not a declarative/JS pair racing each
         other. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Kettlebell workouts. Class booking. Weekly challenge. All in one app."
    />

    <!-- Brand mark for the browser tab and any "add to home screen" save —
         keep these two filenames (favicon.png / apple-touch-icon.png) and
         the og:image / twitter:image filenames below in sync with the
         files this template ships alongside (see public/) and with
         APP_SHARE_URL in src/lib/links.ts if that ever moves. -->
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <!-- Installable home screen app. manifest.json's own start_url/scope
         ("./") are relative to the manifest's URL, not this page's, so they
         resolve to the GitHub Pages base path (/docs-fitness-app/)
         correctly without hardcoding it here — same reason the icon hrefs
         throughout this file are plain relative paths, not absolute ones.
         The icon itself (icon-192.png / icon-512.png / apple-touch-icon.png
         above) is the kettlewave mark (DECAL 1: KETTLE-WAVE.png, the real
         committed artwork, mechanically recolored — not redrawn) in pure
         white line art on the app's own in-UI Augusta green (#076652)
         background, as an INTERIM home screen icon — the real app icon
         design is a separate, already-tracked decision. theme-color below
         uses that same #076652, matching the icon's own background so the
         installed app's launch frame and icon read as one continuous
         color. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#076652" />

    <!-- iOS has no real manifest support — Add to Home Screen reads these
         instead. apple-mobile-web-app-capable is the one that actually
         switches Safari into standalone mode (no address bar/chrome) on
         launch; the other two are the iOS-only equivalents of
         theme-color/short_name above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DOC'S" />

    <!-- Open Graph — the rich preview card shown by Messages, WhatsApp,
         Instagram DMs, Slack, and most email clients when this link is
         shared. og:image/og:url must be fully-qualified absolute URLs per
         spec; relative paths aren't reliably resolved by every crawler.

         A SINGLE og:image, pointing at the square 1200x1200 version, on
         purpose. Two rounds of trying multiple og:image tags (wide first,
         then square first) both still showed iMessage tiling/cropping the
         image — reordering never changed the symptom, which means
         iMessage isn't reliably respecting "first tag wins" the way its
         behavior seemed to suggest, and there's no reliable way from here
         to make a specific consumer choose the "right" one out of several.
         A single square image removes that ambiguity entirely: every
         consumer gets the same file, and a square image degrades
         acceptably everywhere (including on wide-preferring cards), while
         a wide image forced into iMessage's square-ish preview does not.
         Twitter/X still gets its own dedicated wide image below via
         twitter:image, a separate tag this doesn't touch.

         The "-v3" suffix on both filenames below is a deliberate cache bust
         (v2 -> v3): the v2 file's pixels were re-verified correct (crew
         photo composition, no CTA) both locally and by fetching the exact
         file GitHub was serving at the deployed commit, so this wasn't a
         bad regeneration — but a platform preview was still showing a
         stale image, and per the same Instagram-caching precedent that
         motivated v1 -> v2, the only reliable fix for a cache like that is
         a brand new URL. If this image is ever regenerated again, bump
         the suffix again (v4, v5, ...) rather than overwriting the same
         filename in place. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docsfitnessnj.github.io/docs-fitness-app" />
    <meta property="og:title" content="Join Doc's Fitness: Train Online or In Person" />
    <meta
      property="og:description"
      content="Kettlebell workouts. Class booking. Weekly challenge. All in one app."
    />
    <meta property="og:image" content="https://docsfitnessnj.github.io/docs-fitness-app/share-image-square-v3.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Doc's Fitness — kettlebell training, in person and online." />

    <!-- Twitter/X Card — mirrors the Open Graph tags above. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join Doc's Fitness: Train Online or In Person" />
    <meta
      name="twitter:description"
      content="Kettlebell workouts. Class booking. Weekly challenge. All in one app."
    />
    <meta name="twitter:image" content="https://docsfitnessnj.github.io/docs-fitness-app/share-image-v3.jpg" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element

         Extended past the stock reset to fix the app's full-screen height
         on iOS. Rounds 1-2 (plain `height: 100%`, then `height: 100dvh`)
         and rounds 3-4-6 (a JS-measured `--app-height` custom property,
         written from `visualViewport.height`/`window.innerHeight` on
         every resize/orientationchange/visualViewport event, plus an
         increasingly elaborate initial-settle burst chasing a ~45px
         shortfall that kept reappearing specifically in the installed
         standalone app) are gone as of round 8 below — none of that JS
         ever fully closed the gap on a real device, which is exactly the
         bug it was trying to fix.

         Round 8 (this one — plain `100dvh`, no JS at all): the dynamic
         viewport height unit is a *browser-native* equivalent of what
         rounds 3-4-6 were trying to hand-roll in JS — it's defined to
         always equal the real, current visual viewport (tracking Safari's
         collapsing/expanding toolbar in browser chrome; equal to the full
         physical screen in standalone, where there's no toolbar to
         collapse), updated by the browser engine itself with no
         JS-measurement round-trip, no settle timing to race, and nothing
         to go stale. Supported since iOS Safari 15.4 (this app's whole
         target audience). The fallback chain below (`100%`, then `100vh`,
         then `100dvh`) means a browser that doesn't understand the
         `100dvh` line simply never applies it (an unsupported unit makes
         the whole declaration invalid, not a fallback to a default) and
         keeps the previous line instead — `100vh` on anything pre-15.4,
         `100%` if neither viewport unit is understood at all. `#welcome-
         screen-root`/`#about-screen-root`'s `min-height` further down
         uses the same plain `100dvh` — see their own comment.

         Round 5 (--app-offset-top, for the on-screen keyboard) is the one
         thing here that genuinely can't be expressed as a CSS unit, and
         stays as JS: opening the keyboard shrinks the visual viewport's
         height (which `100dvh` already tracks correctly on its own), but
         iOS Safari separately auto-scrolls — pans the *visual* viewport
         down within the *layout* viewport — to keep the focused input
         clear of the keyboard, changing visualViewport.offsetTop. WebKit
         deliberately positions `position: fixed` elements against the
         layout viewport, not the visual one (that's the whole reason the
         VisualViewport API exists), so a fixed, correctly-*sized* #root
         still sits at the layout viewport's untouched origin while the
         pan moves the visible slice somewhere else entirely — the app
         scrolls up out of view and what's left on screen is blank browser
         canvas above the keyboard. --app-offset-top mirrors
         visualViewport.offsetTop, and the signed-in layout (see
         useWebDocumentScroll.ts's `locked` branch, which also switches
         #root to `position: fixed` so it isn't clipped by html/body's
         fixed-height overflow:hidden box) translates #root by that
         amount, sliding it back under the panned visual viewport instead
         of leaving it behind. -->
    <script>
      (function () {
        // Round 7 (this one — the real double-counting source): this
        // app's own fills were never the only thing on the page reading
        // env(safe-area-inset-*). react-native-safe-area-context's own
        // web implementation does too — it appends a hidden probe div to
        // document.body sized by env(safe-area-inset-*), measures it, and
        // feeds the real pixel values through useSafeAreaInsets() /
        // <SafeAreaView> live. That's invisible in every desktop/mobile
        // BROWSER test (no notch, so it measures 0 — indistinguishable
        // from "doesn't do anything"), but very real in an installed
        // standalone iPhone PWA, where it was quietly adding the real
        // inset a second time on top of this app's own fills: AppTopBar's
        // <SafeAreaView edges={['top']}>, the tab bar's own
        // `Math.max(insets.bottom, 6)`/useTabBarHeight, DocThreadView's
        // and DocsGroupChatScreen's composer padding. See
        // AppSafeAreaProvider.tsx, which now pins that library's own
        // context to zero on web permanently, and AGENTS.md.
        //
        // With that neutralized, exactly ONE thing on the page may read
        // env(safe-area-inset-*) at all: this probe, right here. It
        // writes the real measured pixel values to --real-safe-top /
        // --real-safe-bottom on <html>, and every one of this app's own
        // fills/overrides below consumes ONLY those two variables — never
        // env() directly — so there is structurally one source of truth
        // to audit instead of an env() rule on every screen.
        function syncSafeAreaInsets() {
          var top = document.getElementById('safe-area-probe-top');
          var bottom = document.getElementById('safe-area-probe-bottom');
          if (top) {
            document.documentElement.style.setProperty('--real-safe-top', getComputedStyle(top).height);
          }
          if (bottom) {
            document.documentElement.style.setProperty('--real-safe-bottom', getComputedStyle(bottom).height);
          }
        }
        // --app-height is gone (see "Round 8" above) -- #root's own
        // height is now plain CSS (100dvh), tracked by the browser engine
        // with no JS involved at all. The only thing still measured here
        // is --app-offset-top (Round 5, the keyboard-pan compensation,
        // which genuinely has no CSS-only equivalent) and
        // --real-safe-top/--real-safe-bottom (Round 7, the safe-area
        // probe). Both still need to react to resize/visualViewport
        // changes, so the listeners stay -- there's just nothing left for
        // them to do with height.
        // Round 11's own addition: window.visualViewport.scale. The
        // viewport meta lock and the gesturestart/change/end
        // preventDefault below (see further down) are meant to stop a
        // scale change from ever happening at all, but some iOS versions
        // can still land away from scale 1 despite both. There's nothing
        // to "recover" here beyond what this function already does on
        // every call: --app-offset-top and --real-safe-top/bottom are
        // read fresh from the live DOM/visualViewport every time, never
        // cached, so a scale change that slips through self-corrects on
        // its own next event once scale returns to 1 -- exposing it as
        // --viewport-scale is purely so that's checkable (by this file's
        // own debug overlay, or a test) rather than invisible. No visible
        // UI ever reacts to this value.
        //
        // Round 12's own addition: --keyboard-inset, fixing a regression
        // Round 8 introduced. #root's height is plain 100dvh (ordinary
        // browser tabs) or 100lvh (standalone -- see Round 13's @media
        // (display-mode: standalone) block below) now, no JS, which is
        // correct for Safari's collapsing/expanding TOOLBAR but -- a real
        // device confirmed -- does NOT shrink for the on-screen KEYBOARD
        // the way the old JS-measured --app-height (gone since Round 8)
        // used to. The keyboard instead only shrinks visualViewport.height
        // and pans its offsetTop, exactly like Round 5's --app-offset-top
        // already accounts for at the #root level -- but a bottom-anchored
        // composer (group chat, comment, Message Doc, any future one)
        // sits at the bottom of the FULL, un-shrunk #root, which is now
        // geometrically behind the keyboard, with nothing of its own
        // compensating for that. --keyboard-inset is exactly the gap
        // between the two: how much of #root's own full height the
        // keyboard is covering that visualViewport's pan didn't already
        // reveal. A bottom-anchored composer reads this (see the
        // #*-keyboard-rise rules below) and rises by that amount via
        // transform -- never a JS height on the shell itself, which stays
        // plain 100dvh/100lvh exactly as Round 8/13 left it. Clamped to 0
        // so ordinary toolbar collapse/expand (which 100dvh already
        // handles on its own) never produces a negative rise.
        //
        // Round 13's own fix to this formula: "#root's own full height"
        // is NOT always window.innerHeight. A real device, measured via
        // the debug overlay, showed window.innerHeight/visualViewport.
        // height/100dvh all agreeing on 860px in standalone while 100lvh
        // read 874px -- iOS reserves dynamic viewport space in standalone
        // that never actually gets used there (no toolbar ever collapses
        // when there's no toolbar at all), so 100dvh undershoots the true
        // screen by that gap, and #root (now sized by 100lvh in
        // standalone -- see below) is actually 874px tall, not 860. Using
        // window.innerHeight (860) as "full height" here would under-rise
        // every composer by that same 14px gap on top of the real keyboard
        // height. In standalone, the full-height term is read from the
        // same #debug-probe-100lvh element DebugOverlay.web.tsx's own
        // report already uses (one measured value, two consumers, not a
        // second independent measurement of the same thing) -- in
        // ordinary browser tabs, where #root is still 100dvh and
        // window.innerHeight already agrees with it, the formula is
        // unchanged.
        function syncOffsetAndInsets() {
          var vv = window.visualViewport;
          var offsetTop = vv ? vv.offsetTop : 0;
          document.documentElement.style.setProperty('--app-offset-top', offsetTop + 'px');
          document.documentElement.style.setProperty('--viewport-scale', String(vv ? vv.scale : 1));
          var fullHeight = window.innerHeight;
          if (window.matchMedia('(display-mode: standalone)').matches) {
            var lvhProbe = document.getElementById('debug-probe-100lvh');
            var lvhPx = lvhProbe ? parseFloat(getComputedStyle(lvhProbe).height) : NaN;
            if (!isNaN(lvhPx)) fullHeight = lvhPx;
          }
          var keyboardInset = vv ? Math.max(0, fullHeight - vv.height - offsetTop) : 0;
          document.documentElement.style.setProperty('--keyboard-inset', keyboardInset + 'px');
          syncSafeAreaInsets();
        }

        // Round 14: a "last keyboard snapshot", for exactly the gap this
        // round's own debug-overlay upgrade is meant to close -- a real
        // installed-iPhone keyboard event is gone by the time anyone can
        // open the overlay and read it (opening it takes 5 deliberate taps
        // on the wordmark, which itself dismisses focus/the keyboard). This
        // captures the numbers automatically, the instant a real keyboard
        // open is detected, into a plain `window` global -- not component
        // state, not a CSS variable (this is a composite object, not a
        // single value) -- so it survives this app's own in-session SPA
        // navigation (closing the chat, switching tabs, anything short of
        // an actual page reload) with no extra wiring: DebugOverlay.web.tsx
        // just reads window.__lastKeyboardSnapshot whenever it happens to
        // be opened next, exactly like it already reads --keyboard-inset
        // via getComputedStyle.
        //
        // "A keyboard opened" is detected the same way --keyboard-inset
        // itself is computed: visualViewport.height shrinking by more than
        // 100px (an arbitrary but generous floor -- far bigger than any
        // orientation/toolbar jitter, comfortably smaller than any real
        // software keyboard, which is always a few hundred px tall). Only
        // visualViewport's OWN 'resize' event is checked against this
        // threshold (see onVisualViewportResize below) -- not every call to
        // syncOffsetAndInsets() (window resize/orientationchange/load/
        // pageshow also call it, but a keyboard specifically shrinks the
        // VISUAL viewport, not the layout one, which is the whole reason
        // --keyboard-inset reads vv.height instead of window.innerHeight in
        // the first place).
        var lastVisualViewportHeight = window.visualViewport ? window.visualViewport.height : null;
        var KEYBOARD_SNAPSHOT_SHRINK_THRESHOLD = 100;
        var KEYBOARD_RISE_COMPOSER_IDS = ['group-chat-composer-keyboard-rise', 'doc-thread-composer-keyboard-rise', 'post-detail-composer-keyboard-rise'];
        function captureLastKeyboardSnapshot() {
          var vv = window.visualViewport;
          if (!vv) return;
          var composerId = null;
          var composerRect = null;
          var composerTransform = null;
          for (var i = 0; i < KEYBOARD_RISE_COMPOSER_IDS.length; i++) {
            var el = document.getElementById(KEYBOARD_RISE_COMPOSER_IDS[i]);
            if (el) {
              var rect = el.getBoundingClientRect();
              composerId = KEYBOARD_RISE_COMPOSER_IDS[i];
              composerRect = { top: Math.round(rect.top), bottom: Math.round(rect.bottom), height: Math.round(rect.height) };
              composerTransform = getComputedStyle(el).transform;
              break;
            }
          }
          var lvhProbe = document.getElementById('debug-probe-100lvh');
          window.__lastKeyboardSnapshot = {
            timestamp: new Date().toISOString(),
            innerHeight: window.innerHeight,
            vvHeight: Math.round(vv.height),
            vvOffsetTop: Math.round(vv.offsetTop),
            // Read back from the CSS variable (already recomputed by the
            // syncOffsetAndInsets() call this always runs after -- see
            // onVisualViewportResize) rather than recalculated here a
            // second time, so the snapshot can never disagree with the one
            // number every other consumer in this file also reads.
            keyboardInset: getComputedStyle(document.documentElement).getPropertyValue('--keyboard-inset').trim() || '(unset)',
            lvhPx: lvhProbe ? Math.round(parseFloat(getComputedStyle(lvhProbe).height)) : null,
            composerId: composerId,
            composerRect: composerRect,
            composerTransform: composerTransform,
          };
        }
        function onVisualViewportResize() {
          var vv = window.visualViewport;
          var previousHeight = lastVisualViewportHeight;
          syncOffsetAndInsets();
          if (vv) {
            if (previousHeight !== null && previousHeight - vv.height > KEYBOARD_SNAPSHOT_SHRINK_THRESHOLD) {
              captureLastKeyboardSnapshot();
            }
            lastVisualViewportHeight = vv.height;
          }
        }

        syncOffsetAndInsets();
        window.addEventListener('resize', syncOffsetAndInsets);
        window.addEventListener('orientationchange', syncOffsetAndInsets);
        window.addEventListener('load', syncOffsetAndInsets);
        window.addEventListener('pageshow', syncOffsetAndInsets);
        if (window.visualViewport) {
          // 'resize' catches the keyboard opening/closing (and is also the
          // one event the last-keyboard-snapshot capture above watches);
          // 'scroll' catches offsetTop changing on its own, which happens
          // when iOS pans to reveal a focused input without the visible
          // height necessarily changing at the same instant.
          window.visualViewport.addEventListener('resize', onVisualViewportResize);
          window.visualViewport.addEventListener('scroll', syncOffsetAndInsets);
        }

        // Viewport lock, belt-and-suspenders round. The viewport meta's
        // maximum-scale=1/user-scalable=no is the primary lock (reliable
        // in home-screen standalone mode, our actual target) but ordinary
        // Safari can ignore user-scalable for accessibility, and a real
        // device check found pinch-zooming the standalone app scales the
        // whole layout, unglues the fixed top bar and tab bar from the
        // viewport, wrecks the bottom safe-area spacing, and can leave the
        // page subtly zoomed afterward -- exactly what Skool and other
        // native-feeling apps never allow. Two independent fallbacks:
        //
        // 1. gesturestart/gesturechange/gestureend are WebKit's own
        //    (non-standard, Safari-only) events for a two-finger pinch or
        //    rotate -- preventDefault on all three stops iOS from ever
        //    starting that native PAGE-zoom gesture at all, regardless of
        //    what the viewport meta says. { passive: false } is required
        //    for preventDefault to actually take effect. This is
        //    orthogonal to the two screens that DO use a two-finger pinch
        //    for their own in-app purpose (MediaViewer.tsx's photo
        //    pinch-zoom, ProfilePhotoCropModal.tsx's crop pinch-zoom):
        //    both read raw touch events (onTouchStart/PanResponder) via
        //    the standard Touch Events API, a completely separate event
        //    family from these WebKit gesture events, so suppressing the
        //    browser's own page-zoom here doesn't touch them -- if
        //    anything it helps, by guaranteeing the browser never races
        //    their own handler for ownership of a two-finger touch.
        //    Verified both still work after this change.
        // 2. If a scale change ever does slip through anyway on some iOS
        //    version, see syncOffsetAndInsets above (--viewport-scale) --
        //    there is no separate recovery step needed because nothing
        //    here was caching a scale-dependent value in the first place.
        document.addEventListener(
          'gesturestart',
          function (e) {
            e.preventDefault();
          },
          { passive: false }
        );
        document.addEventListener(
          'gesturechange',
          function (e) {
            e.preventDefault();
          },
          { passive: false }
        );
        document.addEventListener(
          'gestureend',
          function (e) {
            e.preventDefault();
          },
          { passive: false }
        );
      })();
    </script>
    <style id="expo-reset">
      /* Stops a downward drag inside any scroll container from chaining
         past its own edge to the browser, which is what triggers a native
         pull-to-refresh (a full page reload — on the signed-in app, that
         reload used to land back on the pre-signup Welcome screen, having
         nothing but in-memory state to restore from; see
         MembershipContext's localStorage persistence for the other half of
         that fix). overscroll-behavior only affects an element that is
         itself scrollable, so applying it to every element here is a
         no-op everywhere except the actual scroll containers (every
         screen's <ScrollView>) — no need to hunt down and annotate each
         one individually, and any ScrollView added later is covered too.
         `contain` (not `none`) so a screen can still show its own
         legitimate bounce/rubber-band at its own edges — it just never
         hands that gesture up to the browser chrome. */
      * {
        overscroll-behavior-y: contain;
      }
      /* Kills the browser's default blue focus ring on every text input and
         textarea, app-wide — iOS Safari draws it the instant any composer
         or field is focused (chat, comments, search, profile, sign in,
         ...), and it doesn't respect this app's own design language at
         all. A global selector here is deliberate rather than hunting down
         every TextInput individually: react-native-web renders every
         TextInput as a plain <input>/<textarea>, so this one rule reaches
         all of them, present and future, with no risk of missing one. The
         app's own quiet replacement (the field's container border
         shifting from the hairline to brand green on focus) is applied
         per-component since react-native-web's TextInput style reset
         already zeroes out `border` itself (see TextInput/index.js) — the
         *visible* border members actually see lives one level up, on the
         pill/row View wrapping the input. */
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
      }
      /* These styles make the body full-height, tracking Safari's
         collapsing/expanding toolbar instead of a one-time snapshot --
         see "Round 8" above the inline script for the fallback chain. */
      html,
      body {
        height: 100%;
        height: 100vh;
        height: 100dvh;
        background-color: #FBFBF9;
        overscroll-behavior-y: none;
        /* Belt-and-suspenders alongside the viewport meta's
           maximum-scale=1/user-scalable=no and the gesturestart/change/end
           handlers above: "pan-x pan-y" permits ordinary single-finger
           scrolling/panning in both directions but deliberately leaves out
           "pinch-zoom", the one named value that lets the browser claim a
           two-finger touch for its own native zoom -- so that gesture
           falls straight through to this app's own touch handlers
           instead (MediaViewer's photo pinch-zoom, ProfilePhotoCropModal's
           crop pinch-zoom, both already untouched by this, and the story
           viewer's swipe-to-close, which is single-finger). Also removes
           the double-tap-to-zoom gesture, same as the viewport meta.
           ProfilePhotoCropModal additionally sets body.style.touchAction =
           'none' directly (a plain inline style, which always wins over
           this stylesheet rule regardless of specificity) only while its
           own crop frame is open, and restores whatever was here
           afterward -- see its own comment for why that screen needs
           total touch exclusivity, not just pinch-zoom excluded. */
        touch-action: pan-x pan-y;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        flex: 1;
        background-color: #FBFBF9;
        /* Harmless (0px) unless useWebDocumentScroll.ts's `locked` branch
           has also switched #root to position: fixed — see the Round 5
           comment above the inline script for why. */
        transform: translateY(var(--app-offset-top, 0px));
      }
      /* The probes themselves -- sized by the REAL env() value (0 in
         ordinary browser chrome, the real inset in standalone), measured
         once by syncSafeAreaInsets() into --real-safe-top/--real-safe-
         bottom. Nothing else in this file, and nothing in React's render
         tree (AppSafeAreaProvider pins useSafeAreaInsets()/<SafeAreaView>
         to zero on web), may read env(safe-area-inset-*) at all -- this
         is it, the one sanctioned consumer. */
      #safe-area-probe-top,
      #safe-area-probe-bottom {
        position: fixed;
        left: 0;
        width: 0;
        z-index: -1;
        visibility: hidden;
        pointer-events: none;
      }
      #safe-area-probe-top {
        top: 0;
        height: env(safe-area-inset-top, 0px);
      }
      #safe-area-probe-bottom {
        bottom: 0;
        height: env(safe-area-inset-bottom, 0px);
      }
      /* The hidden debug overlay's own probes (see DebugOverlay.web.tsx --
         tap the "DOC'S FITNESS" wordmark 5x within 2s to open it). Same
         zero-footprint technique as the safe-area probes above: these
         exist unconditionally (whether or not the overlay is ever opened)
         so they're always settled and ready to read, never created/torn
         down on demand. They resolve all four viewport-height CSS units to
         real pixel values so the overlay can show, on a real device,
         whether any of them already disagree with
         window.innerHeight/visualViewport.height -- which is exactly how
         Round 13's standalone-only 100dvh-undershoots-the-real-screen bug
         (100lvh measured 874px, 100dvh/visualViewport.height/
         window.innerHeight all agreed on a shorter 860px -- see the
         @media (display-mode: standalone) block above and the inline
         script's "Round 13" comment) was actually found: NOT the "should
         all read identical in standalone, no toolbar to collapse"
         assumption an earlier round made here -- that assumption was
         simply wrong, which is the whole reason this diagnostic exists
         rather than trusting the assumption. #debug-probe-100lvh is no
         longer purely diagnostic as of Round 13 -- syncOffsetAndInsets()
         also reads it directly as --keyboard-inset's own full-height term
         in standalone (one measured value, two consumers), so it must
         stay present and correctly computed even if the debug overlay
         itself is ever removed. */
      #debug-probe-100dvh,
      #debug-probe-100svh,
      #debug-probe-100lvh,
      #debug-probe-100vh {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        z-index: -1;
        visibility: hidden;
        pointer-events: none;
      }
      #debug-probe-100dvh {
        height: 100dvh;
      }
      #debug-probe-100svh {
        height: 100svh;
      }
      #debug-probe-100lvh {
        height: 100lvh;
      }
      #debug-probe-100vh {
        height: 100vh;
      }
      /* Extends a fixed-height bottom bar/composer's own background through
         the home-indicator safe area, all the way to the physical bottom
         edge of the screen, in an installed/standalone iPhone PWA. These
         elements carry no RN-authored height of their own (see
         SafeAreaBottomFill), so this is the only rule that sets one: 0px,
         invisible, in ordinary browser chrome (including regular Safari,
         where the real inset is also 0 since the browser's own chrome
         already occupies that space), and the real measured inset in
         standalone mode -- read from --real-safe-bottom (see the probe
         above), never env() directly. */
      #tab-bar-safe-area-fill,
      #group-chat-composer-safe-area-fill,
      #doc-thread-composer-safe-area-fill {
        height: var(--real-safe-bottom, 0px);
      }
      /* The keyboard-regression fix (see the inline script's "Round 12"
         comment on --keyboard-inset for the full why). Each bottom-
         anchored composer rises by exactly the amount of itself the
         keyboard is covering that visualViewport's own pan didn't already
         reveal -- 0px (no-op) whenever the keyboard is closed, since
         --keyboard-inset itself is 0 then, which is also what returns the
         composer to its normal position (right on top of its own safe-area
         fill above) the instant the keyboard closes. transform, not a
         layout property, so this never affects any sibling's position or
         triggers reflow. */
      #group-chat-composer-keyboard-rise,
      #doc-thread-composer-keyboard-rise,
      #post-detail-composer-keyboard-rise {
        transform: translateY(calc(-1 * var(--keyboard-inset, 0px)));
      }
      /* CreatePostModal's title/body inputs are plain in-flow content
         inside its own ScrollView, not a fixed bottom bar -- the browser's
         native focus-scroll-into-view already keeps the focused one clear
         of the keyboard. This is a defensive no-op-when-closed floor on
         the scroll content's own bottom padding, insurance for a very tall
         body entry leaving no room to scroll the last line above the
         keyboard, not a fix for a confirmed bug the way the rule above is. */
      #create-post-scroll-content {
        padding-bottom: var(--keyboard-inset, 0px);
      }
      /* Top-edge counterpart: covers the status bar / notch / Dynamic
         Island area, in an installed, standalone iPhone PWA, on any
         full-screen layout that doesn't render the main app top bar (that
         one already handles this correctly via SafeAreaView). Same
         reasoning as the bottom-fill rule above -- 0px, invisible, in
         ordinary browser chrome (the URL bar already occupies that space
         there), the real measured inset (--real-safe-top) in standalone
         mode. One shared id: every SafeAreaTopFill instance wants the
         exact same height, so there's no need for a new id (and a new
         rule here) per screen. */
      #safe-area-top-fill {
        height: var(--real-safe-top, 0px);
      }
      /* ScreenOverlay's own fill, for the ~18 secondary full-screen
         layouts (Profile, Memberships, Settings, the hamburger drawer,
         etc.) that were each originally built with a flat `paddingTop: 60`
         of their own (clearing a hidden tab bar's worth of chrome in
         ordinary browser chrome, long before SafeAreaTopFill existed).
         Rather than keep that 60 on each of those ~18 screens AND stack a
         plain env()-only fill in front of it (the exact "roughly double"
         top-offset regression this round fixes), the 60 is folded into
         THIS one shared choke point instead -- a single additive source of
         both the flat breathing-room value and the real inset. See
         ScreenOverlay.tsx's `topBasePadding` prop and AGENTS.md. */
      #screen-overlay-safe-top-60 {
        height: calc(60px + var(--real-safe-top, 0px));
      }
      /* The remaining full-screen layouts below each already carried their
         own flat paddingTop (the ordinary-browser-chrome breathing-room
         value, predating SafeAreaTopFill) on their own root container --
         rather than ALSO render a separate SafeAreaTopFill sibling there
         (stacking two independent top offsets in standalone mode), each
         rule below adds the real inset directly onto that screen's own
         existing padding via `calc()`, the same additive technique as
         #welcome-back-safe-top further down. One rule per distinct
         baseline value; several screens share 60. See AGENTS.md's "Web
         safe-area insets always report zero" writeup. */
      #story-viewer-safe-top {
        padding-top: calc(50px + var(--real-safe-top, 0px)) !important;
      }
      #create-post-safe-top {
        padding-top: calc(16px + var(--real-safe-top, 0px)) !important;
      }
      #media-viewer-safe-top {
        padding-top: calc(56px + var(--real-safe-top, 0px)) !important;
      }
      #invite-friend-safe-top {
        padding-top: calc(48px + var(--real-safe-top, 0px)) !important;
      }
      #story-locked-safe-top,
      #post-detail-safe-top,
      #log-results-safe-top,
      #sign-in-safe-top,
      #pricing-safe-top,
      #in-person-plans-safe-top,
      #how-do-you-train-safe-top,
      #forgot-password-safe-top,
      #online-start-safe-top,
      #set-new-password-safe-top {
        padding-top: calc(60px + var(--real-safe-top, 0px)) !important;
      }
      /* WelcomeScreen's BACK control floats over its centered hero
         (position: absolute) rather than sitting in normal flow like every
         other screen's back button, so a SafeAreaTopFill sibling can't push
         it down the way it pushes normal-flow content. `!important` is
         needed to beat the inline `top: 60` (its regular-browser-chrome
         value) RN's style prop compiles to -- additive with that value, not
         a replacement, so standalone mode gets 60px of the same visual
         breathing room on top of the real inset, never less than before. */
      #welcome-back-safe-top {
        top: calc(60px + var(--real-safe-top, 0px)) !important;
      }
      /* Pins WelcomeScreen's (and, same reasoning, AboutScreen onboarding
         variant's) root to a real minimum height equal to the same plain
         `100dvh` #root itself now uses (see "Round 8" above), instead of
         letting its flex:1 chain collapse to its own content's shrink-
         wrapped size in the pre-signup "natural document scroll" mode --
         see the comment on WelcomeScreen's `container` style for the full
         why. AboutScreen (the real first-thing-a-member-sees "WELCOME TO
         DOC'S FITNESS" screen -- confusingly, a *different* component
         than WelcomeScreen.tsx, which is actually the sign-up form) had
         the exact same hole and had never gotten this fix: confirmed via
         a direct #root height measurement that it was collapsing to a
         fraction of the real viewport height in standalone mode, which a
         real device read as a huge empty band up top and dead space below
         -- easy to miss from a plain screenshot since overflow:visible
         still paints the (overflowing) content in roughly the right place
         even while the ancestor chain's own boxes are wrong. min-height
         (not height) so the page can still grow taller and scroll when a
         validation message or the keyboard needs more room than one
         screen's worth. */
      #welcome-screen-root,
      #about-screen-root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Round 13: in standalone mode, size the shell with 100lvh instead
         of 100dvh -- measured directly via the debug overlay on a real
         installed iPhone: 100lvh read 874px while 100dvh/
         visualViewport.height/window.innerHeight all agreed on a shorter
         860px, and #root/html/body/every fill ended exactly at 860,
         leaving a 14px band of the page's own background color below
         everything, down to the true physical screen edge. 100dvh is
         DEFINED to track Safari's collapsing/expanding toolbar -- but
         there is no toolbar at all in standalone (no address bar, no
         chrome to collapse), so "dynamic" has nothing correct to track
         there, and iOS was reserving that dynamic space without ever
         using it. 100lvh (the large/full, toolbar-already-collapsed
         viewport height) is the right unit for the one environment this
         gap was actually reported in.
         Ordinary browser tabs (no @media match here) are intentionally
         UNTOUCHED -- the base html/body/#root/welcome/about rules above
         keep their unmodified 100dvh fallback chains exactly as Round 8
         left them, because there a real Safari toolbar genuinely does
         come and go and 100dvh is the correct unit to track it with.
         Same fallback-chain technique as those base rules (100%, then
         100vh, then 100lvh -- an unsupported unit invalidates only that
         one declaration, never the whole rule), and the SAME selectors as
         their own base rules, placed after them so the cascade's own
         source-order tiebreak (equal specificity, later wins) is what
         applies the override -- not !important, not a separate
         mechanism. See the inline script's "Round 13" comment for how
         --keyboard-inset's own full-height term was updated to match
         (100lvh here, not window.innerHeight, in standalone) so the
         keyboard-rise math stays correct against this taller shell. */
      @media (display-mode: standalone) {
        html,
        body {
          height: 100%;
          height: 100vh;
          height: 100lvh;
        }
        #root {
          height: 100%;
          height: 100vh;
          height: 100lvh;
        }
        #welcome-screen-root,
        #about-screen-root {
          min-height: 100vh;
          min-height: 100lvh;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The ONE sanctioned reader of env(safe-area-inset-*) on this page
         (see the inline script's Round 7 comment above and AGENTS.md).
         Hidden (zero size, not in the layout flow, never painted), sized
         entirely by #safe-area-probe-css below so a real env() value can
         still reach them even though they carry no RN-authored style of
         their own. syncSafeAreaInsets() reads their resolved pixel height
         and writes it to --real-safe-top / --real-safe-bottom, which is
         the only thing any fill elsewhere in the app is allowed to read. -->
    <div id="safe-area-probe-top"></div>
    <div id="safe-area-probe-bottom"></div>
    <!-- DebugOverlay.web.tsx's own probes -- see the CSS comment above. -->
    <div id="debug-probe-100dvh"></div>
    <div id="debug-probe-100svh"></div>
    <div id="debug-probe-100lvh"></div>
    <div id="debug-probe-100vh"></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
